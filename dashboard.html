const BASE_VISITS = 1444;

// ---- Revenue model ----
const REVENUE_CATS = [
  { id: "lab", name: "Laboratory Tests", orders: 9065, rate: 13.0, note: "Blended common labs (CBC ~$10, CMP ~$14)" },
  { id: "xray", name: "X-Ray", orders: 1159, rate: 45.0, note: "Global rate, plain film e.g. chest 2-view" },
  { id: "mri", name: "MRI / MR Imaging", orders: 311, rate: 500.0, note: "Global rate (technical + professional)" },
  { id: "ct", name: "CT Scan", orders: 53, rate: 250.0, note: "Global rate, head CT ~$207; body higher" },
  { id: "us", name: "Ultrasound", orders: 85, rate: 120.0, note: "Global rate, abdomen complete" },
  { id: "other", name: "Other (DEXA, Nuc Med, PET, EEG/EMG, ECG)", orders: 298, rate: 364.0, note: "Simple average of 5 rates ($45,$400,$1200,$150,$25)" },
  { id: "sleep", name: "Sleep Studies", orders: 41, rate: 600.0, note: "Attended polysomnography" },
  { id: "pft", name: "Pulmonary Function Tests", orders: 10, rate: 40.0, note: "Spirometry / PFT panel" },
  { id: "proc", name: "Procedures (GI + Other)", orders: 46, rate: 350.0, note: "Outpatient GI e.g. colonoscopy/EGD" },
];
const RX_CATS = [
  { id: "rx_inf", name: "Rx: Infusions", orders: 242 },
  { id: "rx_inj", name: "Rx: Injectables", orders: 569 },
  { id: "rx_oral", name: "Rx: Oral / Topical / etc.", orders: 2199 },
];

// ---- Cost model ----
const FIRST_SITE_FEE = 7500;
const ADDITIONAL_SITE_FEE = 5000;
const PER_SPECIALTY = 25;
const ALL_SPECIALTY_CAP = 750;
const PER_PROVIDER = 300;
const TELEHEALTH_PER_SITE = 150;

const SPECIALTIES = [
  "Adolescent Medicine", "Audiology", "Addiction Medicine", "Adult Psychiatry / Psychology",
  "Cardiology", "Cardiothoracic Surgery", "Dermatology", "Endocrinology", "ENT",
  "Gastroenterology", "General Surgery", "Hematology & Oncology", "Hepatology",
  "Infectious Disease", "Nephrology", "Neurology", "Neurosurgery", "Obesity Medicine",
  "OB/GYN", "Ophthalmology", "Orthopedics", "Pain Management", "Pediatrics",
  "Pediatric Cardiology", "Pediatric Psychiatry / Psychology", "Pharmacist", "Podiatry",
  "Primary Care", "PT / OT", "Pulmonology", "Radiology", "Rheumatology",
  "Sports Medicine (PM&R)", "Sleep Medicine", "Urgent Care", "Urology", "Vascular",
];

const fmtMoney = (n) =>
  n.toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
const fmtMoney2 = (n) =>
  n.toLocaleString("en-US", { style: "currency", currency: "USD", minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtNum = (n) => Math.round(n).toLocaleString("en-US");

function CombinedDashboard() {
  const [population, setPopulation] = useState("");
  const [pct, setPct] = useState(33);
  const [enabled, setEnabled] = useState(Object.fromEntries(REVENUE_CATS.map((c) => [c.id, true])));
  const [rates, setRates] = useState(Object.fromEntries(REVENUE_CATS.map((c) => [c.id, c.rate])));

  const [sites, setSites] = useState("");
  const [providers, setProviders] = useState("");
  const [selected, setSelected] = useState(() => new Set());

  const [openStep, setOpenStep] = useState({ rev: false, cost: false });
  const toggleStep = (k) => setOpenStep((o) => ({ ...o, [k]: !o[k] }));

  const popNum = Number(population);
  const pctNum = Number(pct);
  const visits =
    Number.isFinite(popNum) && popNum > 0 && Number.isFinite(pctNum)
      ? Math.round(popNum * (pctNum / 100))
      : 0;
  const v = visits;

  const rows = useMemo(
    () =>
      REVENUE_CATS.map((c) => {
        const rate = Number(rates[c.id]) || 0;
        const perVisitOrders = c.orders / BASE_VISITS;
        const revPerVisit = perVisitOrders * rate;
        return { ...c, rate, perVisitOrders, revPerVisit, projOrders: perVisitOrders * v, projRev: revPerVisit * v };
      }),
    [v, rates]
  );
  const annualRevenue = rows.reduce((acc, r) => (enabled[r.id] ? acc + r.projRev : acc), 0);
  const totalRevPerVisit = rows.reduce((acc, r) => (enabled[r.id] ? acc + r.revPerVisit : acc), 0);
  const activeCount = REVENUE_CATS.filter((c) => enabled[c.id]).length;
  const rxRows = RX_CATS.map((c) => ({ ...c, perVisitOrders: c.orders / BASE_VISITS, projOrders: (c.orders / BASE_VISITS) * v }));
  const rxTotalProj = rxRows.reduce((acc, r) => acc + r.projOrders, 0);

  const s = Number.isFinite(sites) && sites > 0 ? sites : 0;
  const p = Number.isFinite(providers) && providers > 0 ? providers : 0;
  const setupFee = s > 0 ? FIRST_SITE_FEE + (s - 1) * ADDITIONAL_SITE_FEE : 0;
  const allSelected = selected.size === SPECIALTIES.length;
  const specialtyMonthly = allSelected ? ALL_SPECIALTY_CAP : selected.size * PER_SPECIALTY;
  const selectAllSavings = SPECIALTIES.length * PER_SPECIALTY - ALL_SPECIALTY_CAP;
  const providerMonthly = p * PER_PROVIDER;
  const telehealthMonthly = s * TELEHEALTH_PER_SITE;
  const monthlyCost = specialtyMonthly + providerMonthly + telehealthMonthly;
  const annualCost = monthlyCost * 12;

  const netAnnual = annualRevenue - annualCost;
  const netYearOne = annualRevenue - annualCost - setupFee;
  const totalFirstYearCost = annualCost + setupFee;
  const roiPct = totalFirstYearCost > 0 ? (netYearOne / totalFirstYearCost) * 100 : 0;
  const monthlyRevenue = annualRevenue / 12;
  const monthlyNet = monthlyRevenue - monthlyCost;
  const paybackMonths = monthlyNet > 0 ? setupFee / monthlyNet : null;

  const toggle = (id) => setEnabled((e) => ({ ...e, [id]: !e[id] }));
  const handleRate = (id, val) => setRates((r) => ({ ...r, [id]: val === "" ? "" : Math.max(0, Number(val)) }));
  const resetRates = () => setRates(Object.fromEntries(REVENUE_CATS.map((c) => [c.id, c.rate])));
  const handlePopulation = (val) => setPopulation(val === "" ? "" : Math.max(0, Math.floor(Number(val))));
  const handlePct = (val) => setPct(val === "" ? "" : Math.max(0, Number(val)));
  const toggleSpec = (name) =>
    setSelected((prev) => {
      const next = new Set(prev);
      if (next.has(name)) next.delete(name);
      else next.add(name);
      return next;
    });
  const selectAll = () => setSelected(new Set(SPECIALTIES));
  const clearAll = () => setSelected(new Set());

  const hasData = population !== "" && v > 0;

  return (
    <div style={styles.page}>
      <style>{css}</style>

      <header style={styles.header}>
        <img src={LOGO_SRC} alt="Rural Health Hub" style={styles.logo} />
        <div style={styles.kicker}>PROGRAM ROI DASHBOARD</div>
        <h1 style={styles.h1}>Revenue &amp; Investment Dashboard</h1>
        <p style={styles.sub}>
          A complete picture of your Rural Health Hub program. Everything starts at zero — complete{" "}
          <strong>Step 1</strong> to estimate the new outpatient revenue these service lines
          generate, then <strong>Step 2</strong> to build your subscription and startup cost. The
          dashboard above fills in as you go.
        </p>
      </header>

      <section style={styles.dashWrap}>
        <div style={styles.dashGrid} className="dash-grid">
          <div style={styles.dashRev}>
            <div style={styles.dashLabel}>ANNUAL REVENUE GENERATED</div>
            <div style={styles.dashValue}>{fmtMoney(annualRevenue)}</div>
            <div style={styles.dashMeta}>{activeCount} services · {fmtNum(v)} visits/yr</div>
          </div>
          <div style={styles.dashCost}>
            <div style={styles.dashLabel}>ANNUAL SUBSCRIPTION</div>
            <div style={styles.dashValue}>{fmtMoney(annualCost)}</div>
            <div style={styles.dashMeta}>{fmtMoney(monthlyCost)}/mo recurring</div>
          </div>
          <div style={styles.dashStartup}>
            <div style={styles.dashLabel}>ONE-TIME STARTUP</div>
            <div style={styles.dashValue}>{fmtMoney(setupFee)}</div>
            <div style={styles.dashMeta}>{fmtNum(s)} {s === 1 ? "site" : "sites"}</div>
          </div>
        </div>

        <div style={styles.netGrid} className="net-grid">
          <div style={{ ...styles.netCard, ...(netAnnual >= 0 ? styles.netPos : styles.netNeg) }}>
            <div style={styles.netLabel}>NET ANNUAL BENEFIT <span style={styles.netSub}>(ongoing years)</span></div>
            <div style={styles.netValue}>{fmtMoney(netAnnual)}</div>
            <div style={styles.netMeta}>Annual revenue − annual subscription</div>
          </div>
          <div style={{ ...styles.netCard, ...(netYearOne >= 0 ? styles.netPos : styles.netNeg) }}>
            <div style={styles.netLabel}>NET — YEAR ONE <span style={styles.netSub}>(incl. startup)</span></div>
            <div style={styles.netValue}>{fmtMoney(netYearOne)}</div>
            <div style={styles.netMeta}>Revenue − subscription − one-time startup</div>
          </div>
        </div>

        <div style={styles.roiRow} className="roi-row">
          <div style={styles.roiItem}>
            <div style={styles.roiNum}>{hasData ? `${roiPct >= 0 ? "+" : ""}${roiPct.toFixed(0)}%` : "—"}</div>
            <div style={styles.roiLbl}>First-year ROI</div>
          </div>
          <div style={styles.roiDivider} className="roi-divider" />
          <div style={styles.roiItem}>
            <div style={styles.roiNum}>
              {!hasData ? "—" : paybackMonths === null ? "N/A" : paybackMonths < 1 ? "<1 mo" : `${paybackMonths.toFixed(1)} mo`}
            </div>
            <div style={styles.roiLbl}>Startup payback period</div>
          </div>
          <div style={styles.roiDivider} className="roi-divider" />
          <div style={styles.roiItem}>
            <div style={styles.roiNum}>{hasData ? fmtMoney(monthlyNet) : "—"}</div>
            <div style={styles.roiLbl}>Net monthly (ongoing)</div>
          </div>
        </div>
        {!hasData && <div style={styles.dashHint}>↓ Open Step 1 below to populate the dashboard</div>}
      </section>
